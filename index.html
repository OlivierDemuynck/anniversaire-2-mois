<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a0a2e">
<title>Pour toi, mon cœur 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Lato:wght@300;400&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Animation d'ouverture : bouquet qui pousse (1 fleur = 1 mois), porté du CodePen "blossoming flowers" -->
<div id="opening-overlay" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-end;justify-content:center;transition:opacity 1s ease;background:var(--bg-base,#0d0515);overflow:hidden;perspective:1000px;">
  <div class="op-night"></div>
  <div id="opening-stars" style="position:absolute;inset:0;z-index:1;overflow:hidden;"></div>
  <div id="op-flowers" class="op-flowers">
    <!-- Herbe de fond, portée du CodePen (2 touffes, chacune avec 8 feuilles) -->
    <div class="op-grass-wrap">
      <div class="op-grass op-grass--1">
        <div class="op-grass-top"></div>
        <div class="op-grass-bottom"></div>
        <div class="op-grass-leaf op-grass-leaf--1"></div>
        <div class="op-grass-leaf op-grass-leaf--2"></div>
        <div class="op-grass-leaf op-grass-leaf--3"></div>
        <div class="op-grass-leaf op-grass-leaf--4"></div>
        <div class="op-grass-leaf op-grass-leaf--5"></div>
        <div class="op-grass-leaf op-grass-leaf--6"></div>
        <div class="op-grass-leaf op-grass-leaf--7"></div>
        <div class="op-grass-leaf op-grass-leaf--8"></div>
        <div class="op-grass-overlay"></div>
      </div>
    </div>
    <div class="op-grass-wrap">
      <div class="op-grass op-grass--2">
        <div class="op-grass-top"></div>
        <div class="op-grass-bottom"></div>
        <div class="op-grass-leaf op-grass-leaf--1"></div>
        <div class="op-grass-leaf op-grass-leaf--2"></div>
        <div class="op-grass-leaf op-grass-leaf--3"></div>
        <div class="op-grass-leaf op-grass-leaf--4"></div>
        <div class="op-grass-leaf op-grass-leaf--5"></div>
        <div class="op-grass-leaf op-grass-leaf--6"></div>
        <div class="op-grass-leaf op-grass-leaf--7"></div>
        <div class="op-grass-leaf op-grass-leaf--8"></div>
        <div class="op-grass-overlay"></div>
      </div>
    </div>
    <!-- Grand brin (g-long) -->
    <div class="op-grow-ans" style="--d:1.2s">
      <div class="op-g-long">
        <div class="op-g-long__top"></div>
        <div class="op-g-long__bottom"></div>
      </div>
    </div>

    <!-- Feuillages latéraux (g-right x2) -->
    <div class="op-grow-ans" style="--d:2.4s">
      <div class="op-g-right op-g-right--1"><div class="op-leaf"></div></div>
    </div>
    <div class="op-grow-ans" style="--d:2.8s">
      <div class="op-g-right op-g-right--2"><div class="op-leaf"></div></div>
    </div>

    <!-- Feuillage avant (g-front, 8 petites feuilles) -->
    <div class="op-grow-ans" style="--d:2.8s">
      <div class="op-g-front">
        <div class="op-g-front__leaf-wrapper op-g-front__leaf-wrapper--1"><div class="op-g-front__leaf"></div></div>
        <div class="op-g-front__leaf-wrapper op-g-front__leaf-wrapper--2"><div class="op-g-front__leaf"></div></div>
        <div class="op-g-front__leaf-wrapper op-g-front__leaf-wrapper--3"><div class="op-g-front__leaf"></div></div>
        <div class="op-g-front__leaf-wrapper op-g-front__leaf-wrapper--4"><div class="op-g-front__leaf"></div></div>
        <div class="op-g-front__leaf-wrapper op-g-front__leaf-wrapper--5"><div class="op-g-front__leaf"></div></div>
        <div class="op-g-front__leaf-wrapper op-g-front__leaf-wrapper--6"><div class="op-g-front__leaf"></div></div>
        <div class="op-g-front__leaf-wrapper op-g-front__leaf-wrapper--7"><div class="op-g-front__leaf"></div></div>
        <div class="op-g-front__leaf-wrapper op-g-front__leaf-wrapper--8"><div class="op-g-front__leaf"></div></div>
        <div class="op-g-front__line"></div>
      </div>
    </div>

    <!-- Feuillage avant-droit (g-fr, 8 petites feuilles) -->
    <div class="op-grow-ans" style="--d:3.2s">
      <div class="op-g-fr">
        <div class="op-leaf"></div>
        <div class="op-g-fr__leaf op-g-fr__leaf--1"></div>
        <div class="op-g-fr__leaf op-g-fr__leaf--2"></div>
        <div class="op-g-fr__leaf op-g-fr__leaf--3"></div>
        <div class="op-g-fr__leaf op-g-fr__leaf--4"></div>
        <div class="op-g-fr__leaf op-g-fr__leaf--5"></div>
        <div class="op-g-fr__leaf op-g-fr__leaf--6"></div>
        <div class="op-g-fr__leaf op-g-fr__leaf--7"></div>
        <div class="op-g-fr__leaf op-g-fr__leaf--8"></div>
      </div>
    </div>

    <!-- Emballage du bouquet -->
    <div class="op-wrap"></div>
    <div class="op-ribbon"></div>
    <div class="op-bow-wing op-bow-wing--l"></div>
    <div class="op-bow-wing op-bow-wing--r"></div>
    <div class="op-bow-knot"></div>
  </div>
  <div class="op-caption">Pour toi, mon cœur…</div>
</div>
<style>
  @keyframes fadeIn { 0% { opacity: 0; transform: translate(-50%,8px); } 100% { opacity: 1; transform: translate(-50%,0); } }

  .op-night {
    position: fixed; left: 50%; top: 0; transform: translateX(-50%);
    width: 100%; height: 100%; z-index: 0;
    filter: blur(0.1vmin);
    background-image:
      radial-gradient(ellipse at top, transparent 0%, var(--bg-base,#0d0515)),
      radial-gradient(ellipse at bottom, var(--bg-base,#0d0515), rgba(var(--glow,120,20,80),0.28)),
      repeating-linear-gradient(220deg, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 19px, transparent 19px, transparent 22px),
      repeating-linear-gradient(189deg, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 19px, transparent 19px, transparent 22px),
      repeating-linear-gradient(148deg, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 19px, transparent 19px, transparent 22px),
      linear-gradient(90deg, rgb(var(--c1,210,100,150)), rgb(var(--c2,160,90,210)));
  }
  .opening-star {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.8);
    animation: starTwinkle ease-in-out infinite;
  }
  @keyframes starTwinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }

  .op-caption {
    position: absolute; left: 50%; bottom: 6vmin; transform: translateX(-50%); z-index: 50;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px;
    color: rgba(220,160,190,0.85); white-space: nowrap;
    animation: fadeIn 1s ease 0.6s both;
  }

  /* ── Fleurs façon CodePen : tige + feuilles + pétales + cœur + lumières ── */
  .op-flowers { position: relative; z-index: 10; transform: scale(0.9); }
  .op-flower { position: absolute; bottom: 10vmin; transform-origin: bottom center; z-index: 10; }
  @keyframes op-sway { 0%, 100% { transform: rotate(var(--baseRot,0deg)); } 50% { transform: rotate(calc(var(--baseRot,0deg) + var(--swayAmt,2deg))); } }

  .op-line {
    width: 1.5vmin;
    background-image:
      linear-gradient(to left, rgba(0,0,0,0.2), transparent, rgba(255,255,255,0.15)),
      linear-gradient(to top, transparent 10%, #1d4a1a, #6fb35f);
    box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
    animation: op-grow 1.6s backwards;
  }
  @keyframes op-grow { 0% { height: 0; border-radius: 1vmin; } }

  .op-line-leaf {
    --w: 6vmin; --h: calc(var(--w) + 2vmin);
    position: absolute; top: 20%; left: 90%;
    width: var(--w); height: var(--h);
    border-top-right-radius: var(--h); border-bottom-left-radius: var(--h);
    background-image: linear-gradient(to top, rgba(20,70,18,0.5), #6fb35f);
  }
  .op-line-leaf--r { transform: rotate(70deg) rotateY(30deg); }
  .op-line-leaf--l {
    border-top-right-radius: 0; border-bottom-left-radius: 0;
    border-top-left-radius: var(--h); border-bottom-right-radius: var(--h);
    left: -460%; transform: rotate(-70deg) rotateY(30deg);
  }
  @keyframes op-leaf-right { 0% { transform-origin: left; transform: rotate(70deg) rotateY(30deg) scale(0); } }
  @keyframes op-leaf-left  { 0% { transform-origin: right; transform: rotate(-70deg) rotateY(30deg) scale(0); } }

  .op-leafs { position: relative; animation: op-bloom 2s backwards; }
  @keyframes op-bloom { 0% { transform: scale(0); } }
  .op-leafs::after {
    content: ''; position: absolute; left: 0; top: 0; transform: translate(-50%,-100%);
    width: 8vmin; height: 8vmin; background-color: rgb(var(--c1,210,100,150)); filter: blur(10vmin); opacity: 0.55;
  }
  .op-petal {
    position: absolute; bottom: 0; left: 50%; width: 8vmin; height: 11vmin;
    border-radius: 51% 49% 47% 53% / 44% 45% 55% 69%;
    transform-origin: bottom center; opacity: 0.92;
    box-shadow: inset 0 0 2vmin rgba(255,255,255,0.45);
    background-image: linear-gradient(to top, color-mix(in srgb, rgb(var(--pc,210,100,150)) 55%, black), rgb(var(--pc,210,100,150)));
  }
  .op-petal--1 { transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg); }
  .op-petal--2 { transform: translate(-50%, -4%) rotateX(40deg); }
  .op-petal--3 { transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg); }
  .op-petal--4 {
    width: 8vmin; height: 8vmin; transform-origin: bottom left;
    border-radius: 4vmin 10vmin 4vmin 4vmin;
    transform: translate(0%, 18%) rotateX(70deg) rotate(-43deg);
    background-image: linear-gradient(to top, color-mix(in srgb, rgb(var(--pc2,225,150,60)) 55%, black), rgb(var(--pc2,225,150,60)));
    z-index: 1; opacity: 0.85;
  }
  .op-white-circle {
    position: absolute; left: -3.5vmin; top: -3vmin; width: 9vmin; height: 4vmin;
    border-radius: 50%; background-color: #fff;
  }
  .op-white-circle::after {
    content: ''; position: absolute; left: 50%; top: 45%; transform: translate(-50%,-50%);
    width: 60%; height: 60%; border-radius: inherit;
    background-image:
      repeating-linear-gradient(135deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 12px),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0px, rgba(0,0,0,0.03) 1px, transparent 1px, transparent 12px),
      linear-gradient(90deg, #ffeb12, #ffce00);
  }
  .op-light {
    position: absolute; bottom: 0vmin; width: 1vmin; height: 1vmin; border-radius: 50%;
    filter: blur(0.2vmin); animation: op-light-ans 4s linear infinite backwards;
  }
  @keyframes op-light-ans {
    0%   { opacity: 0; transform: translateY(0vmin); }
    25%  { opacity: 1; transform: translateY(-5vmin) translateX(-2vmin); }
    50%  { opacity: 1; transform: translateY(-15vmin) translateX(2vmin); filter: blur(0.2vmin); }
    75%  { transform: translateY(-20vmin) translateX(-2vmin); filter: blur(0.2vmin); }
    100% { transform: translateY(-30vmin); opacity: 0; filter: blur(1vmin); }
  }

  /* ── Emballage du bouquet : papier en cône + ruban + nœud ── */
  .op-wrap {
    position: absolute; left: 50%; bottom: 0; transform: translateX(-50%) scale(0);
    width: 46vmin; height: 20vmin; z-index: 5;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    background: linear-gradient(135deg, #ece0c8, #cca877 55%, #a3805a);
    box-shadow: inset 0 0 3vmin rgba(0,0,0,0.25), 0 1vmin 2vmin rgba(0,0,0,0.4);
    animation: op-wrap-in 1s 0.15s cubic-bezier(.3,1.5,.4,1) backwards;
  }
  .op-wrap::before {
    content: ''; position: absolute; inset: 0; clip-path: inherit;
    background-image: repeating-linear-gradient(70deg, rgba(255,255,255,0.09) 0px, rgba(255,255,255,0.09) 1px, transparent 1px, transparent 8px);
  }
  @keyframes op-wrap-in { 0% { transform: translateX(-50%) scale(0); } }

  .op-ribbon {
    position: absolute; left: 50%; bottom: 24%; transform: translate(-50%, 50%) rotate(-3deg);
    width: 48vmin; height: 3.2vmin; z-index: 6;
    background: rgb(var(--c1,210,100,150));
    box-shadow: 0 0.3vmin 0.6vmin rgba(0,0,0,0.35);
    animation: op-wrap-in 1s 0.3s cubic-bezier(.3,1.5,.4,1) backwards;
  }
  .op-bow-wing {
    position: absolute; left: 50%; bottom: 24%; width: 4.6vmin; height: 5.2vmin; z-index: 7;
    background: rgb(var(--c2,160,90,210));
    box-shadow: 0 0.3vmin 0.5vmin rgba(0,0,0,0.3);
    animation: op-wrap-in 1s 0.45s cubic-bezier(.3,1.5,.4,1) backwards;
  }
  .op-bow-wing--l { border-radius: 60% 60% 5% 60%; transform: translate(calc(-100% - 0.3vmin), 50%) rotate(-20deg); }
  .op-bow-wing--r { border-radius: 60% 60% 60% 5%; transform: translate(0.3vmin, 50%) rotate(20deg); }
  .op-bow-knot {
    position: absolute; left: 50%; bottom: 24%; transform: translate(-50%, 50%); z-index: 8;
    width: 2.8vmin; height: 2.8vmin; border-radius: 50%;
    background: rgb(var(--c1,210,100,150));
    box-shadow: 0 0.2vmin 0.4vmin rgba(0,0,0,0.3);
    animation: op-wrap-in 1s 0.55s cubic-bezier(.3,1.5,.4,1) backwards;
  }

  /* ── Herbe de fond, portée fidèlement du CodePen (2 touffes × 8 feuilles) ── */
  .op-grass-wrap { animation: op-growing-grass-wrap 1s 2s backwards; }
  @keyframes op-growing-grass-wrap { 0% { transform: scale(0); } }

  .op-grass {
    --c: #2f8a2a; --line-w: 1.5vmin;
    position: absolute; bottom: 12vmin; left: -7vmin;
    display: flex; flex-direction: column; align-items: flex-end;
    z-index: 4; transform-origin: bottom center;
    transform: rotate(-48deg) rotateY(40deg);
    animation: op-moving-grass 2s linear infinite;
  }
  .op-grass--2 {
    left: 2vmin; bottom: 10vmin; opacity: 0.8; z-index: 0;
    transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);
    animation: op-moving-grass-2 1.5s linear infinite;
  }
  @keyframes op-moving-grass { 0%, 100% { transform: rotate(-48deg) rotateY(40deg); } 50% { transform: rotate(-50deg) rotateY(40deg); } }
  @keyframes op-moving-grass-2 { 0%, 100% { transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg); } 50% { transform: scale(0.5) rotate(79deg) rotateX(10deg) rotateY(-200deg); } }

  .op-grass-top {
    width: 7vmin; height: 10vmin; border-top-right-radius: 100%;
    border-right: var(--line-w) solid var(--c);
    transform-origin: bottom center; transform: rotate(-2deg);
  }
  .op-grass-bottom {
    margin-top: -2px; width: var(--line-w); height: 25vmin;
    background-image: linear-gradient(to top, transparent, var(--c));
  }
  .op-grass-leaf {
    --size: 10vmin; position: absolute;
    width: calc(var(--size) * 2.1); height: var(--size);
    border-top-left-radius: var(--size); border-top-right-radius: var(--size);
    background-image: linear-gradient(to top, transparent, transparent 30%, var(--c));
    z-index: 100;
  }
  .op-grass-leaf--1 { top: -6%; left: 30%; --size: 6vmin; transform: rotate(-20deg); animation: op-grass-leaf-1 2s 2.6s backwards; }
  @keyframes op-grass-leaf-1 { 0% { transform-origin: bottom left; transform: rotate(-20deg) scale(0); } }
  .op-grass-leaf--2 { top: -5%; left: -110%; --size: 6vmin; transform: rotate(10deg); animation: op-grass-leaf-2 2s 2.4s linear backwards; }
  @keyframes op-grass-leaf-2 { 0% { transform-origin: bottom right; transform: rotate(10deg) scale(0); } }
  .op-grass-leaf--3 { top: 5%; left: 60%; --size: 8vmin; transform: rotate(-18deg) rotateX(-20deg); animation: op-grass-leaf-3 2s 2.2s linear backwards; }
  @keyframes op-grass-leaf-3 { 0% { transform-origin: bottom left; transform: rotate(-18deg) rotateX(-20deg) scale(0); } }
  .op-grass-leaf--4 { top: 6%; left: -135%; --size: 8vmin; transform: rotate(2deg); animation: op-grass-leaf-4 2s 2s linear backwards; }
  @keyframes op-grass-leaf-4 { 0% { transform-origin: bottom right; transform: rotate(2deg) scale(0); } }
  .op-grass-leaf--5 { top: 20%; left: 60%; --size: 10vmin; transform: rotate(-24deg) rotateX(-20deg); animation: op-grass-leaf-5 2s 1.8s linear backwards; }
  @keyframes op-grass-leaf-5 { 0% { transform-origin: bottom left; transform: rotate(-24deg) rotateX(-20deg) scale(0); } }
  .op-grass-leaf--6 { top: 22%; left: -180%; --size: 10vmin; transform: rotate(10deg); animation: op-grass-leaf-6 2s 1.6s linear backwards; }
  @keyframes op-grass-leaf-6 { 0% { transform-origin: bottom right; transform: rotate(10deg) scale(0); } }
  .op-grass-leaf--7 { top: 39%; left: 70%; --size: 10vmin; transform: rotate(-10deg); animation: op-grass-leaf-7 2s 1.4s linear backwards; }
  @keyframes op-grass-leaf-7 { 0% { transform-origin: bottom left; transform: rotate(-10deg) scale(0); } }
  .op-grass-leaf--8 { top: 40%; left: -215%; --size: 11vmin; transform: rotate(10deg); animation: op-grass-leaf-8 2s 1.2s linear backwards; }
  @keyframes op-grass-leaf-8 { 0% { transform-origin: bottom right; transform: rotate(10deg) scale(0); } }

  .op-grass-overlay {
    position: absolute; top: -10%; right: 0%; width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.6); filter: blur(1.5vmin); z-index: 100;
  }

  /* ── Reste du décor de fond, porté fidèlement du CodePen ── */
  .op-grow-ans { animation: op-pop-ans 2s var(--d) backwards; }
  @keyframes op-pop-ans { 0% { transform: scale(0); opacity: 0; } }

  .op-g-long {
    --w: 2vmin; --h: 6vmin; --c: #2f8a2a;
    position: absolute; bottom: 10vmin; left: -3vmin;
    transform-origin: bottom center; transform: rotate(-30deg) rotateY(-20deg);
    display: flex; flex-direction: column; align-items: flex-end;
    animation: op-g-long-ans 3s linear infinite;
  }
  @keyframes op-g-long-ans { 0%, 100% { transform: rotate(-30deg) rotateY(-20deg); } 50% { transform: rotate(-32deg) rotateY(-20deg); } }
  .op-g-long__top {
    top: calc(var(--h) * -1); width: calc(var(--w) + 1vmin); height: var(--h);
    border-top-right-radius: 100%; border-right: 0.7vmin solid var(--c);
    transform: translate(-0.7vmin, 1vmin);
  }
  .op-g-long__bottom {
    width: var(--w); height: 50vmin; transform-origin: bottom center;
    background-image: linear-gradient(to top, transparent 30%, var(--c));
    box-shadow: inset 0 0 2px rgba(0,0,0,0.5);
    clip-path: polygon(35% 0, 65% 1%, 100% 100%, 0% 100%);
  }

  .op-g-right { position: absolute; bottom: 6vmin; left: -2vmin; transform-origin: bottom left; transform: rotate(20deg); }
  .op-g-right .op-leaf {
    width: 30vmin; height: 50vmin; border-top-left-radius: 100%; border-left: 2vmin solid #1d6e1a;
    background-image: linear-gradient(to bottom, transparent, var(--bg-base,#0d0515) 60%);
    -webkit-mask-image: linear-gradient(to top, transparent 30%, #1d6e1a 60%);
    mask-image: linear-gradient(to top, transparent 30%, #1d6e1a 60%);
  }
  .op-g-right--1 { animation: op-g-right-ans 2.5s linear infinite; }
  .op-g-right--2 { left: 5vmin; transform: rotateY(-180deg); animation: op-g-right-ans-2 3s linear infinite; }
  .op-g-right--2 .op-leaf { height: 75vmin; filter: blur(0.3vmin); opacity: 0.8; }
  @keyframes op-g-right-ans { 0%, 100% { transform: rotate(20deg); } 50% { transform: rotate(24deg) rotateX(-20deg); } }
  @keyframes op-g-right-ans-2 { 0%, 100% { transform: rotateY(-180deg) rotate(0deg) rotateX(-20deg); } 50% { transform: rotateY(-180deg) rotate(6deg) rotateX(-20deg); } }

  .op-g-front {
    position: absolute; bottom: 6vmin; left: 2.5vmin; z-index: 100;
    transform-origin: bottom center; transform: rotate(-28deg) rotateY(30deg) scale(1.04);
    animation: op-g-front-ans 2s linear infinite;
  }
  @keyframes op-g-front-ans { 0%, 100% { transform: rotate(-28deg) rotateY(30deg) scale(1.04); } 50% { transform: rotate(-35deg) rotateY(40deg) scale(1.04); } }
  .op-g-front__line { width: 0.3vmin; height: 20vmin; background-image: linear-gradient(to top, transparent, #1d6e1a, transparent 100%); position: relative; }
  .op-g-front__leaf-wrapper { position: absolute; top: 0; left: 0; transform-origin: bottom left; transform: rotate(10deg); }
  .op-g-front__leaf-wrapper:nth-child(even) { left: 0vmin; transform: rotateY(-180deg) rotate(5deg); animation: op-g-front-leaf-left 1s ease-in backwards; }
  .op-g-front__leaf-wrapper:nth-child(odd) { animation: op-g-front-leaf 1s ease-in backwards; }
  .op-g-front__leaf-wrapper--1 { top: -8vmin; transform: scale(0.7); animation: op-g-front-leaf 1s 5.5s ease-in backwards !important; }
  .op-g-front__leaf-wrapper--2 { top: -8vmin; transform: rotateY(-180deg) scale(0.7) !important; animation: op-g-front-leaf-left-2 1s 4.6s ease-in backwards !important; }
  .op-g-front__leaf-wrapper--3 { top: -3vmin; animation: op-g-front-leaf 1s 4.6s ease-in backwards; }
  .op-g-front__leaf-wrapper--4 { top: -3vmin; transform: rotateY(-180deg) scale(0.9) !important; animation: op-g-front-leaf-left-2 1s 4.6s ease-in backwards !important; }
  @keyframes op-g-front-leaf-left-2 { 0% { transform: rotateY(-180deg) scale(0); } }
  .op-g-front__leaf-wrapper--5, .op-g-front__leaf-wrapper--6 { top: 2vmin; }
  .op-g-front__leaf-wrapper--7, .op-g-front__leaf-wrapper--8 { top: 6.5vmin; }

// ── Bouquet animé de l'écran d'ouverture (1 fleur = 1 mois), structure fidèle au CodePen ──
const opFlowersEl = document.getElementById('op-flowers');
const opCount = Math.max(1, month.number);
let opMaxDelay = 0;

for (let i = 0; i < opCount; i++) {
  const posInFan = opCount === 1 ? 0 : (i / (opCount - 1)) - 0.5; // -0.5 à 0.5
  const leftVmin = posInFan * Math.min(36, 10 + opCount * 3.5);
  const baseRot = posInFan * 34;
  const stemH = 46 + Math.random() * 16 + (i % 3) * 3; // vmin, comme l'original (55-70vmin pour 3 fleurs)
  const stemDelay = 0.3 + i * 0.3;
  const bloomDelay = 1.1 + i * 0.3;
  const petalColor = i % 2 === 0 ? 'c1' : 'c2';
  const petalColor2 = i % 2 === 0 ? 'c2' : 'c1';
  opMaxDelay = Math.max(opMaxDelay, bloomDelay + 2);

  const flower = document.createElement('div');
  flower.className = 'op-flower';
  flower.style.left = `calc(50% + ${leftVmin}vmin)`;
  flower.style.setProperty('--baseRot', baseRot + 'deg');
  flower.style.setProperty('--swayAmt', (2 + Math.random() * 2) + 'deg');
  flower.style.animation = 'op-sway 4s linear infinite';

  // Tige
  const line = document.createElement('div');
  line.className = 'op-line';
  line.style.height = stemH + 'vmin';
  line.style.animationDelay = stemDelay + 's';

  // 4 petites feuilles le long de la tige, alternées droite/gauche (comme l'original)
  const leafDelays = [stemDelay + 1.3, stemDelay + 1.1, stemDelay + 0.9, stemDelay + 0.7];
  for (let li = 0; li < 4; li++) {
    const isRight = li % 2 === 0;
    const lf = document.createElement('div');
    lf.className = 'op-line-leaf ' + (isRight ? 'op-line-leaf--r' : 'op-line-leaf--l');
    lf.style.top = (12 + li * 12) + '%';
    lf.style.animation = (isRight ? 'op-leaf-right' : 'op-leaf-left') + ' 0.8s ' + leafDelays[li] + 's backwards';
    line.appendChild(lf);
  }
  flower.appendChild(line);

  // Bouquet : 4 pétales + cœur blanc/doré, en haut de la tige
  const leafs = document.createElement('div');
  leafs.className = 'op-leafs';
  leafs.style.position = 'absolute';
  leafs.style.bottom = '100%';
  leafs.style.left = '50%';
  leafs.style.animationDelay = bloomDelay + 's';

  [1, 2, 3, 4].forEach((n) => {
    const petal = document.createElement('div');
    petal.className = 'op-petal op-petal--' + n;
    petal.style.setProperty('--pc', month.theme[petalColor]);
    petal.style.setProperty('--pc2', month.theme[petalColor2]);
    leafs.appendChild(petal);
  });

  const whiteCircle = document.createElement('div');
  whiteCircle.className = 'op-white-circle';
  leafs.appendChild(whiteCircle);

  // 8 petites lumières qui montent depuis la fleur
  for (let l = 0; l < 8; l++) {
    const light = document.createElement('div');
    light.className = 'op-light';
    light.style.left = (Math.random() * 12 - 6) + 'vmin';
    light.style.background = `rgb(var(--${l % 2 === 0 ? petalColor : petalColor2}))`;
    light.style.animationDelay = (bloomDelay + 0.3 + Math.random() * 3.2) + 's';
    leafs.appendChild(light);
  }

  flower.appendChild(leafs);
  opFlowersEl.appendChild(flower);
}

// Les 8 touffes "long-g" de fond, portées du CodePen (délais exacts de l'original)
const LONG_G_DELAYS = [
  [3, 2.2, 3.4, 3.6],
  [3.6, 3.8, 4, 4.2],
  [4, 4.2, 4.4, 4.6],
  [4, 4.2, 3, 3.6],
  [4, 4.2, 3, 3.6],
  [4, 4.2, 3, 3.6],
  [4.2, 4.4, 4.6, 4.8],
  [3, 3.2, 3.5, 3.6]
];
LONG_G_DELAYS.forEach((delays, gi) => {
  const longG = document.createElement('div');
  longG.className = 'op-long-g op-long-g--' + gi;
  delays.forEach((d, li) => {
    const wrap = document.createElement('div');

    wrap.style.setProperty('--d', d + 's');
    const leaf = document.createElement('div');
    leaf.className = 'op-leaf op-leaf--' + li;
    wrap.appendChild(leaf);
    longG.appendChild(wrap);
  });
  opFlowersEl.appendChild(longG);
});

// Onglet caché : double-clic (ou double-tap) sur le footer ouvre les archives
const archiveOverlay = document.getElementById('archive-overlay');
const archiveList = document.getElementById('archive-list');
document.querySelector('.footer').addEventListener('dblclick', openArchive);
let lastTap = 0;
document.querySelector('.footer').addEventListener('touchend', () => {
  const now = Date.now();
  if (now - lastTap < 400) openArchive();
  lastTap = now;
});

function openArchive() {
  archiveList.innerHTML = '';
  MONTHS.forEach(m => {
    const a = document.createElement('a');
    a.href = 'index.html?m=' + m.number;
    a.className = 'archive-item' + (m.number === month.number ? ' current' : '');
    a.innerHTML = `
      <div class="archive-item-num">${m.number}</div>
      <div class="archive-item-info">
        <div class="archive-item-label">${m.number} mois ensemble</div>
        <div class="archive-item-date">${m.dateRange}</div>
      </div>`;
    archiveList.appendChild(a);
  });
  archiveOverlay.classList.add('visible');
}
document.getElementById('archive-close').addEventListener('click', () => archiveOverlay.classList.remove('visible'));
archiveOverlay.addEventListener('click', (e) => { if (e.target === archiveOverlay) archiveOverlay.classList.remove('visible'); });
