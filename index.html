<style>
  @keyframes fadeIn { 0% { opacity: 0; transform: translate(-50%,8px); } 100% { opacity: 1; transform: translate(-50%,0); } }

  .op-night {
    position: fixed; left: 50%; top: 0; transform: translateX(-50%);
    width: 100%; height: 100%; z-index: 0;
    filter: blur(0.1vmin);
    background-image:
      radial-gradient(ellipse at top, transparent 0%, var(--bg-base,#0d0515)),
      radial-gradient(ellipse at bottom, var(--bg-base,#0d0515), rgba(var(--glow,120,20,80),0.28)),
      repeating-linear-gradient(220deg, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 19px, transparent 19px, transparent 22px),
      repeating-linear-gradient(189deg, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 19px, transparent 19px, transparent 22px),
      repeating-linear-gradient(148deg, rgba(0,0,0,0.5) 0px, rgba(0,0,0,0.5) 19px, transparent 19px, transparent 22px),
      linear-gradient(90deg, rgb(var(--c1,210,100,150)), rgb(var(--c2,160,90,210)));
  }
  .opening-star {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.8);
    animation: starTwinkle ease-in-out infinite;
  }
  @keyframes starTwinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }

  .op-caption {
    position: absolute; left: 50%; bottom: 1.5vmin; transform: translateX(-50%); z-index: 250;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px;
    color: rgba(220,160,190,0.85); white-space: nowrap;
    animation: fadeIn 1s ease 0.6s both;
  }

  /* ── Tournesol animé (adapté d'un CodePen, sans tige) ── */
  .sf-scene {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
  }
  .flower_wrapper {
    position: relative; width: 1px; height: 1px;
    animation: sf-sway 4s ease-in-out infinite;
  }
  .flower_center {
    position: absolute; left: 0; top: 0; z-index: 5;
    transform: translate(-50%, -50%) rotate(-10deg);
    width: 20vmin; height: 20vmin; border-radius: 50%;
    background: radial-gradient(circle, #180d00, #8a4a10);
    box-shadow: 0 0 5vmin rgba(255,180,50,0.35);
    animation: sf-open-center 1.2s 0.3s backwards;
  }
  .flower_petal {
    position: absolute; left: 0; bottom: 0; z-index: 3;
    transform: translateX(-50%);
    width: 7vmin; height: 20vmin;
    background: radial-gradient(circle, #ff9d1c, #ffd85c);
    clip-path: ellipse(50% 50% at 50% 50%);
    transform-origin: center bottom;
    animation: sf-open-petal 1.2s 0.7s backwards;
  }
  .flower_petal-1 {
    border-radius: 50% 50% 50% / 80% 80% 20% 20%;
    clip-path: none;
    animation: sf-open-petal 1s 0.7s backwards;
  }
  .flower_petal-2  { transform: translateX(-50%) rotate(-30deg); }
  .flower_petal-3  { transform: translateX(-50%) rotate(-60deg); }
  .flower_petal-4  { transform: translateX(-50%) rotate(-90deg); }
  .flower_petal-5  { transform: translateX(-50%) rotate(-120deg); }
  .flower_petal-6  { transform: translateX(-50%) rotate(-150deg); }
  .flower_petal-7  { transform: translateX(-50%) rotate(30deg); }
  .flower_petal-8  { transform: translateX(-50%) rotate(60deg); }
  .flower_petal-9  { transform: translateX(-50%) rotate(90deg); }
  .flower_petal-10 { transform: translateX(-50%) rotate(120deg); }
  .flower_petal-11 { transform: translateX(-50%) rotate(150deg); }
  .flower_petal-12 { transform: translateX(-50%) rotate(180deg); }

  .flower_light {
    position: absolute; bottom: 8vmin; width: 1vmin; height: 1vmin;
    background-color: #fffb00; border-radius: 50%;
    filter: blur(0.2vmin);
    animation: sf-light-ans 4s linear infinite backwards;
  }
  .flower_light:nth-child(odd) { background-color: #ffde7a; }
  .flower_light-1 { left: -2vmin; animation-delay: 1s; }
  .flower_light-2 { left: 3vmin;  animation-delay: 0.5s; }
  .flower_light-3 { left: -6vmin; animation-delay: 0.3s; }
  .flower_light-4 { left: 6vmin;  animation-delay: 0.9s; }
  .flower_light-5 { left: -1vmin; animation-delay: 1.5s; }
  .flower_light-6 { left: -4vmin; animation-delay: 3s; }
  .flower_light-7 { left: 3vmin;  animation-delay: 2s; }
  .flower_light-8 { left: -6vmin; animation-delay: 3.5s; }

  .sf-bg-light {
    position: absolute; bottom: 0; width: 1vmin; height: 1vmin;
    background-color: #fffb00; border-radius: 50%;
    filter: blur(0.2vmin);
    animation: sf-light-bg-ans 7s linear infinite backwards;
  }
  .sf-bg-light:nth-child(odd) { background-color: #ffde7a; }

  @keyframes sf-sway {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2deg); }
  }
  @keyframes sf-open-petal { 0% { transform: translateX(-50%) rotate(0) scale(0); } }
  @keyframes sf-open-center { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0); } }
  @keyframes sf-light-ans {
    0%   { opacity: 0; transform: translateY(0); }
    25%  { opacity: 1; transform: translateY(-5vmin) translateX(-2vmin); }
    50%  { opacity: 1; transform: translateY(-15vmin) translateX(2vmin); filter: blur(0.2vmin); }
    75%  { transform: translateY(-20vmin) translateX(-2vmin); filter: blur(0.2vmin); }
    100% { transform: translateY(-30vmin); opacity: 0; filter: blur(1vmin); }
  }
  @keyframes sf-light-bg-ans {
    0%   { opacity: 0; transform: translateY(0); }
    25%  { opacity: 1; transform: translateY(-10vmin) translateX(-2vmin); }
    50%  { opacity: 1; transform: translateY(-20vmin) translateX(2vmin); filter: blur(0.2vmin); }
    70%  { transform: translateY(-40vmin) translateX(2vmin); filter: blur(0.2vmin); }
    100% { transform: translateY(-60vmin); opacity: 0; filter: blur(1vmin); }
  }
</style>

window.addEventListener('load', () => {
  const overlay = document.getElementById('opening-overlay');
  setTimeout(() => { overlay.style.opacity = '0'; setTimeout(() => overlay.style.display = 'none', 1000); }, 2600);

// Pseudo-aléatoire déterministe (composition stable d'un rechargement à l'autre)
function detRand(seed) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

// Étoiles scintillantes en fond de l'écran d'ouverture
const starsContainer = document.getElementById('opening-stars');
for (let i = 0; i < 40; i++) {
  const star = document.createElement('div');
  star.className = 'opening-star';
  const size = (detRand(i * 7 + 1) * 2 + 0.6).toFixed(1);
  star.style.width = size + 'px';
  star.style.height = size + 'px';
  star.style.left = Math.round(detRand(i * 7 + 2) * 100) + '%';
  star.style.top = Math.round(detRand(i * 7 + 3) * 100) + '%';
  star.style.animationDuration = (1.8 + detRand(i * 7 + 4) * 2.5).toFixed(1) + 's';
  star.style.animationDelay = (detRand(i * 7 + 5) * 3).toFixed(1) + 's';
  starsContainer.appendChild(star);
}

// Petites lumières qui montent en fond, autour du tournesol
const bgLightsContainer = document.getElementById('sf-bg-lights');
for (let i = 0; i < 14; i++) {
  const light = document.createElement('div');
  light.className = 'sf-bg-light';
  light.style.left = Math.round(detRand(i * 9 + 1) * 100) + '%';
  light.style.animationDelay = (detRand(i * 9 + 2) * 4).toFixed(1) + 's';
  bgLightsContainer.appendChild(light);
}

// Cœurs flottants — tailles/opacités/couleurs variées, avec heartbeat

const HEART_COUNT = 6;
for (let i = 0; i < HEART_COUNT; i++) {

// ══════════════ Gabarits de page (réutilisent les classes CSS existantes) ══════════════

function poemHTML(month) {
  return month.poem.map(strophe => {
    const lines = strophe.lines.map(l => `<span class="verse${strophe.special ? ' poem-special' : ''}">${l}</span>`).join('');
    return `<div class="strophe">${lines}</div>`;
  }).join('');
}

function galleryHTML(month) {
  if (!month.photos || month.photos.length === 0) return '';
  const imgs = month.photos.map((p, i) => {
    const cls = (month.photos.length % 3 === 1 && i === month.photos.length - 1) ? ' class="full"' : '';
    return `<img src="${p.src}" alt="${p.caption || ''}"${cls}>`;
  }).join('');
  return `<div class="card"><div class="card-label">Nos photos</div><div class="gallery">${imgs}</div></div>`;
}

// ══════════════ Système de pages du livre ══════════════

const pages = [{ type: 'intro' }, { type: 'toc' }, ...MONTHS.map(m => ({ type: 'chapter', month: m }))];
let pageIndex = 0;
let subPage = 0; // 0 = page gauche, 1 = page droite (n'a d'effet visuel que sur mobile)
const pageSpread = document.getElementById('page-spread');
const navPrev = document.getElementById('nav-prev');
const navNext = document.getElementById('nav-next');
const isTwoColLayout = () => window.matchMedia('(min-width: 820px)').matches;

function chapterPageIndex(monthNumber) {
  return pages.findIndex(p => p.type === 'chapter' && p.month.number === monthNumber);
}

function applyPageContent(index, landOnRight) {
  pageIndex = Math.max(0, Math.min(pages.length - 1, index));
  subPage = landOnRight ? 1 : 0;
  const page = pages[pageIndex];

  if (page.type === 'intro') pageSpread.innerHTML = introHTML();
  else if (page.type === 'toc') pageSpread.innerHTML = tocHTML();
  else {
    setTheme(page.month);
    renderDecoFlowers(page.month);
    pageSpread.innerHTML = chapterHTML(page.month);
  }
  pageSpread.dataset.sub = String(subPage);
  window.scrollTo({ top: 0 });

  navPrev.disabled = pageIndex === 0 && subPage === 0;
  navNext.disabled = pageIndex === pages.length - 1 && subPage === 1;

  if (page.type === 'intro') {
    document.getElementById('intro-to-toc').addEventListener('click', () => renderPage(1));
  }
  if (page.type === 'toc') {
    document.getElementById('toc-to-intro').addEventListener('click', (e) => { e.preventDefault(); renderPage(0); });
    pageSpread.querySelectorAll('[data-goto-month]').forEach(btn => {
      btn.addEventListener('click', () => renderPage(chapterPageIndex(parseInt(btn.dataset.gotoMonth, 10))));
    });
  }
  if (page.type === 'chapter') {
    showAchievementToast('❤️', 'Accomplissement obtenu !', page.month.number + ' mois parcourus', 400);
  }
}

// Anime une "page qui tourne" : la page sortante pivote légèrement puis disparaît,
// le contenu est remplacé, puis la nouvelle page pivote pour revenir à plat.
function renderPage(index, landOnRight, direction) {
  const dir = direction || (index >= pageIndex ? 'next' : 'prev');
  pageSpread.classList.remove('turn-next-in', 'turn-prev-in');
  pageSpread.classList.add(dir === 'next' ? 'turn-next-out' : 'turn-prev-out');
  setTimeout(() => {
    applyPageContent(index, landOnRight);
    pageSpread.classList.remove('turn-next-out', 'turn-prev-out');
    pageSpread.classList.add(dir === 'next' ? 'turn-next-in' : 'turn-prev-in');
    setTimeout(() => pageSpread.classList.remove('turn-next-in', 'turn-prev-in'), 340);
  }, 220);
}

function goNext() {
  if (!isTwoColLayout() && subPage === 0) {
    pageSpread.classList.add('turn-next-out');
    setTimeout(() => {
      subPage = 1; pageSpread.dataset.sub = '1'; window.scrollTo({ top: 0 });
      navPrev.disabled = false; navNext.disabled = pageIndex === pages.length - 1;
      pageSpread.classList.remove('turn-next-out'); pageSpread.classList.add('turn-next-in');
      setTimeout(() => pageSpread.classList.remove('turn-next-in'), 340);
    }, 220);
    return;
  }
  renderPage(pageIndex + 1, false, 'next');
}
function goPrev() {
  if (!isTwoColLayout() && subPage === 1) {
    pageSpread.classList.add('turn-prev-out');
    setTimeout(() => {
      subPage = 0; pageSpread.dataset.sub = '0'; window.scrollTo({ top: 0 });
      navNext.disabled = false; navPrev.disabled = pageIndex === 0;
      pageSpread.classList.remove('turn-prev-out'); pageSpread.classList.add('turn-prev-in');
      setTimeout(() => pageSpread.classList.remove('turn-prev-in'), 340);
    }, 220);
    return;
  }
  renderPage(pageIndex - 1, !isTwoColLayout(), 'prev');
}

navPrev.addEventListener('click', goPrev);
navNext.addEventListener('click', goNext);
document.getElementById('nav-toc-btn').addEventListener('click', () => renderPage(1));

// Easter egg "je suis caché" — délégation d'événement car le bouton est recréé à chaque page
pageSpread.addEventListener('click', (e) => {
  const btn = e.target.closest('.secret-btn');
  if (!btn) return;
  const msg = btn.nextElementSibling;
  msg.innerHTML = decodeURIComponent(btn.dataset.secret);
  btn.style.display = 'none';
  msg.classList.add('visible');
});

// Onglet caché bonus : double-clic (ou double-tap) sur le footer ouvre le panneau archives
const archiveOverlay = document.getElementById('archive-overlay');
const archiveList = document.getElementById('archive-list');
let lastTap = 0;
function maybeOpenArchive() {
  if (pages[pageIndex].type !== 'chapter') return;
  archiveList.innerHTML = '';
  MONTHS.forEach(m => {
    const a = document.createElement('a');
    a.href = '#';
    a.className = 'archive-item' + (m.number === pages[pageIndex].month.number ? ' current' : '');
    a.innerHTML = `<div class="archive-item-num">${m.number}</div><div class="archive-item-info"><div class="archive-item-label">${m.number} mois ensemble</div><div class="archive-item-date">${m.dateRange}</div></div>`;
    a.addEventListener('click', (e) => { e.preventDefault(); archiveOverlay.classList.remove('visible'); renderPage(chapterPageIndex(m.number)); });
    archiveList.appendChild(a);
  });
  archiveOverlay.classList.add('visible');
}
pageSpread.addEventListener('dblclick', (e) => { if (e.target.closest('.footer')) maybeOpenArchive(); });
pageSpread.addEventListener('touchend', (e) => {
  if (!e.target.closest('.footer')) return;
  const now = Date.now();
  if (now - lastTap < 400) maybeOpenArchive();
  lastTap = now;
});
document.getElementById('archive-close').addEventListener('click', () => archiveOverlay.classList.remove('visible'));
archiveOverlay.addEventListener('click', (e) => { if (e.target === archiveOverlay) archiveOverlay.classList.remove('visible'); });

// ══════════════ Ouverture du livre ══════════════

const bookClosed = document.getElementById('book-closed');
const bookOpen = document.getElementById('book-open');
const bookCover = document.getElementById('book-cover');
const discoverBtn = document.getElementById('discover-btn');

function openBook(startIndex) {
  discoverBtn.classList.add('fading');
  bookCover.classList.add('opening');
  bookOpen.classList.add('visible');
  setTimeout(() => {
    bookClosed.classList.add('hidden');
    renderPage(startIndex);
  }, 750);
}

discoverBtn.addEventListener('click', () => openBook(0));

// Lien direct vers un mois précis (?m=N) : on saute l'étape "livre fermé"
if (deepLinkedMonth) {
  bookClosed.classList.add('hidden');
  bookOpen.classList.add('visible');
  renderPage(chapterPageIndex(deepLinkedMonth.number));
}
} catch (err) {
  console.error('Erreur dans le script du livre (vérifie data.js) :', err);
}
</script>
